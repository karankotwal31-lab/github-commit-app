<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aria</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 34rem;
        padding: 2rem;
        text-align: center;
      }
      p {
        color: #94a3b8;
        line-height: 1.6;
      }
      code {
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Aria desktop is not configured</h1>
      <p>
        Set <code>ARIA_URL</code> to the trusted production HTTPS origin before
        running or packaging the desktop shell. Aria will not guess or reuse an
        old deployment URL.
      </p>
    </main>
  </body>
</html>
