name: Production Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        # actions/checkout v7.0.1 — pinned to the immutable commit for supply-chain safety.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Reject retired deployment origins
        run: |
          retired_origin="$(printf '%s.%s' 'steady-scorpion-839' 'convex.site')"
          if git grep -nF "$retired_origin" -- .; then
            echo "Retired Aria deployment origin found in tracked files. Configure deployment targets explicitly instead of hardcoding an old backend."
            exit 1
          fi

      - name: Setup Bun
        # oven-sh/setup-bun v2.2.0 — Node 24 action, pinned to its release commit.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Validate Convex backend locally
        # In a non-interactive runner with no deploy key, Convex Agent Mode
        # provisions an isolated local backend. This regenerates the real API
        # bindings and validates schema/functions/components without touching
        # any cloud dev or production deployment.
        run: bunx convex dev --once --typecheck-components

      - name: Lint
        run: bun run lint

      - name: Service worker syntax
        run: node --check public/sw.js

      - name: Typecheck and production build
        run: bun run build

      - name: Root unit tests
        run: bun test

      - name: Install legacy extension dependencies
        working-directory: extension
        run: bun install --frozen-lockfile

      - name: Legacy extension typecheck
        working-directory: extension
        run: bunx tsc -p ./ --noEmit

      - name: Install VS Code extension dependencies
        working-directory: extensions/vscode
        run: bun install --frozen-lockfile

      - name: VS Code extension typecheck
        working-directory: extensions/vscode
        run: bunx tsc -p ./ --noEmit

      - name: VS Code extension tests
        working-directory: extensions/vscode
        run: bun test
